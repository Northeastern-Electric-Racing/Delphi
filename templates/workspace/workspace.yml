name: {{name}}            # the folder name; checkouts park and restore repos/ by it
harness: claude-code
repos:                    # cloned into repos/<name> by .delphi/setup.sh
  # name: https://github.com/Northeastern-Electric-Racing/<Repo>.git
references-git:           # read-only dependency sources, shallow-cloned into references/<name> by .delphi/setup.sh
  # name: https://github.com/<owner>/<repo>.git v1.2.3   # optional tag or branch; default: its default branch
links:                    # Delphi workspaces (or main), read-only copies at linked/<name> by .delphi/setup.sh
  # - main                # recommended: this project's shared context, AUTHORING.md and defaults/
