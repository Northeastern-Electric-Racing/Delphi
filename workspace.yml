name: s.app.argos.experimental
harness: claude-code
plugins:                  # `- <scope>[.<set>]`: plugin sets to enable; CI lists the `default` set of every folder above first and generates .claude/settings.json
  - delphi         # default, from software/
  # - argos.testing   # the set at software/application-software/argos/plugins/<harness>/testing/
park:                     # `- <folder>`: root folders that park with this workspace on a switch (.delphi/park.sh), besides the ones it always parks
  - pictures
  - .playwright-mcp
  - .playwright-cli
# .delphi/setup.sh checks out everything below (git-ignored); re-run it after any change.
repos:                    # `<name>: <git-url>`: code you change; a clone at repos/<name>, and separately worktrees/<name>/<branch> (default branch first)
  argos: https://github.com/Northeastern-Electric-Racing/Argos.git
  odyssey-definitions: https://github.com/Northeastern-Electric-Racing/Odyssey-Definitions.git
workspaces:               # `- <name>` (dotted) or `- main`: Delphi workspaces to read, not edit from here; a clone on its branch at workspaces/<name or main>
  - main
