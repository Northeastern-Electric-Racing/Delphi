# Delphi CI (docs/design.md). PRs to main: ci/check.sh (read-only). Pushes to main or ws/**:
# ci/sync.sh merges main into every ws/<name> and opens PRs to main for ws changes. Its pushes use
# GITHUB_TOKEN, which doesn't trigger workflows, so there are no loops (and CI-opened PRs don't run
# `check`; sync.sh runs it itself). Scripts always come from main, never from a ws branch.
name: delphi
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'ws/**']
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ci/check.sh
  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: delphi-sync
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ci/sync.sh
