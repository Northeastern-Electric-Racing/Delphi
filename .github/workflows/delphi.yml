# Delphi CI (docs/design.md §5): PRs must pass check and be in sync; main is re-synced after merges.
# The sync commit is pushed with GITHUB_TOKEN, which does not trigger workflows, so it cannot loop.
name: delphi
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: delphi-${{ github.ref }}
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: cargo build --release --locked && echo "$PWD/target/release" >> "$GITHUB_PATH"
      - run: delphi check && delphi sync --check
  sync-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked && echo "$PWD/target/release" >> "$GITHUB_PATH"
      - run: |
          delphi sync --base HEAD
          git add -A context
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m 'delphi: sync shared files' -m "Delphi-Harness: github-actions
          Delphi-Model: none
          Delphi-Effort: none"
          # if main moved on meanwhile, the run for the newer push syncs it
          git push origin HEAD:main || { git fetch -q origin main; [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; }
