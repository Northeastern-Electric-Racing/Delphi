name: Epic
description: Work too large for one ticket, broken into dev work tickets.
type: Feature
labels: [epic]
body:
  - type: markdown
    attributes:
      value: |
        An epic groups dev work tickets; link them as sub-issues.
        If it came from an idea or spike, link it below and close it as completed.
        After filing, add a written-by label (`by: human`, `by: ai`, `by: ai-assisted`).
  - type: input
    id: from
    attributes:
      label: From
      description: The idea or spike this epic came from, if any.
      placeholder: "#123"
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this delivers, and for whom, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: diagram
    attributes:
      label: Diagram
      description: Illustrate the change, ideally before and after. Mermaid (in a mermaid code block), ASCII, or an uploaded image.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this epic deliberately does not cover.
      value: "- "
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What must be true for the epic to be done. Clear, broad checkboxes. Aim for 3-5; never more than 7.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: context-transfer
    attributes:
      label: Context transfer
      description: Optional. A dump of context for whoever picks this up (person or agent). Start with a short summary, then the raw context.
      value: |
        SUMMARY

        CONTEXT
      render: text
