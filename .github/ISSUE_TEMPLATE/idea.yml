name: Idea
description: A feature or direction worth exploring. Ideas are explored through spikes and, once settled, become an epic.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        **Pipeline:** idea → spikes (sub-issues) → epic → dev work.
        Keep an idea short. If it is small enough to just try, file a spike instead.
        Don't prescribe a solution. Approaches stay open options for spikes to explore, not a chosen design.
        After filing, add a written-by label (`by: human`, `by: ai`, `by: ai-assisted`).
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: One or two sentences. What could we build, and for whom? Describe the outcome, not the implementation.
      placeholder: Let a folder share skills with every workspace below it.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why this idea is good and worth exploring. The reasoning behind it, not a history of the problem.
    validations:
      required: true
  - type: textarea
    id: approaches
    attributes:
      label: Approaches to explore
      description: |
        The range of possible solutions worth exploring. Each bullet is an area (an open question) and the directions worth trying in it.
        List areas that need real exploration or design decisions, not questions with quick answers. Each direction should be big enough to become its own spike.
        Name directions to weigh, not a plan or a recommended pick.
      value: |
        - **Area:** direction, direction, or direction.
    validations:
      required: true
