name: software/application-software/nero/nero-experimental
harness: claude-code
plugins:                  # `- <folder path>/<set>`: plugin sets beyond the `default` set of every folder above; CI generates .claude/settings.json
  # - software/application-software/argos/testing   # the set at software/application-software/argos/plugins/<harness>/testing/
# .delphi/setup.sh checks out everything below (git-ignored); re-run it after any change.
repos:                    # `<name>: <git-url>`: code you change; bare store at repos/<name>, default branch at worktrees/<name>/<branch>
  nero: https://github.com/Northeastern-Electric-Racing/Nero-2.0.git
workspaces:               # `- ws/<name>` or `- main`: Delphi workspaces to read, never edit; shallow copy at linked/<ws/name or main>
  # - main
