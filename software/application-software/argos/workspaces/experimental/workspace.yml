name: software/application-software/argos/experimental
harness: claude-code
plugins:                  # `- <scope>[.<set>]`: plugin sets to enable; CI lists the `default` set of every folder above first and generates .claude/settings.json
  - app            # default, from software/application-software/
  - argos          # default, from software/application-software/argos/
  - app.workflow   # the spec, design, execute workflow (workflow, review, to-tickets)
  # - argos.testing   # the set at software/application-software/argos/plugins/<harness>/testing/
# .delphi/setup.sh checks out everything below (git-ignored); re-run it after any change.
repos:                    # `<name>: <git-url>`: code you change; bare store at repos/<name>, default branch at worktrees/<name>/<branch>
  argos: https://github.com/Northeastern-Electric-Racing/Argos.git
  odyssey-definitions: https://github.com/Northeastern-Electric-Racing/Odyssey-Definitions.git
workspaces:               # `- ws/<name>` or `- main`: Delphi workspaces to read, never edit; shallow copy at linked/<ws/name or main>
  - main
