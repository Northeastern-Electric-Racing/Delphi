# Delphi CI (docs/design.md). This file is at main's root and, identically, at the root of every
# ws/<name> (GitHub runs a push's workflow from the pushed commit, so ws pushes need their own copy).
# PRs to main: ci/check.sh. Pushes to main or ws/**: ci/sync.sh (refresh + propose), always run from
# main. Pushes and PRs made with GITHUB_TOKEN trigger no workflows: no loops, and CI-opened PRs
# don't run `check` (sync.sh runs it itself).
name: delphi
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'ws/**']
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ci/check.sh
  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: delphi-sync
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ci/sync.sh
