name: s.app.hub
harness: claude-code
plugins:                  # `- <scope>[.<set>]`: plugin sets to enable; CI lists the `default` set of every folder above first and generates .claude/settings.json
  - delphi         # default, from software/
  # - argos.testing   # the set at software/application-software/argos/plugins/<harness>/testing/
opt-out:                  # `- <path>`: files from the workspace-inherit/ folders above that CI leaves alone here, so the workspace keeps its own copy (or none)
  # - .claude/skills/journal
# .delphi/setup.sh checks out everything below (git-ignored); re-run it after any change.
repos:                    # `<name>: <git-url>`: code you change; bare store at repos/<name>, default branch at worktrees/<name>/<branch>
  # name: https://github.com/Northeastern-Electric-Racing/<Repo>.git
references-git:           # `<name>: <git-url> [<tag-or-branch>]`: dependency sources to read, never edit; shallow copy at references/<name>
  # name: https://github.com/<owner>/<repo>.git v1.2.3   # no tag or branch: its default branch
workspaces:               # `- <name>` (dotted) or `- main`: Delphi workspaces to read, never edit; shallow copy at linked/<name or main>
  - main
  - s.app.argos.argos-dev
  - s.firmware.calypso.calypso-dev
  - s.app.nero.nero-experimental
